<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myszka - Registrieren</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* Logo oben links platziert */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .logo-container img {
            height: 50px;
            width: auto;
        }

        /* Registrierungs-Box */
        .register-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 24px;
            color: #1a1a1a;
            font-size: 24px;
            text-align: center;
        }

        /* Social Login Buttons */
        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .social-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s;
        }

        .social-btn:hover {
            background: #f8f9fa;
            border-color: #ccc;
        }

        .social-btn img {
            width: 18px;
            height: 18px;
        }

        /* Trennlinie (Oder) */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #888;
            font-size: 13px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider::before {
            margin-right: 10px;
        }

        .divider::after {
            margin-left: 10px;
        }

        /* Umschalter für E-Mail / Telefon */
        .method-selector {
            display: flex;
            margin-bottom: 20px;
            background: #f1f3f5;
            border-radius: 8px;
            padding: 4px;
        }

        .method-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .method-btn.active {
            background: #ffffff;
            color: #000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #4a90e2;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #333;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Logo oben links -->
    <div class="logo-container">
        <img src="logo.jpg" alt="Myszka Logo">
    </div>

    <!-- Registrierungsformular -->
    <div class="register-card">
        <h2>Registrieren</h2>

        <!-- Social Logins (Google & Apple) -->
        <div class="social-buttons">
            <button type="button" class="social-btn" onclick="socialRegister('Google')">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.3 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.19C.43 8.13 0 9.87 0 12s.43 3.87 1.19 5.4l4.08-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.18 2.7 1.19 6.6l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Mit Google registrieren
            </button>
            <button type="button" class="social-btn" onclick="socialRegister('Apple')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 5.31c.65-.79 1.09-1.89.97-2.99-.94.04-2.08.63-2.75 1.42-.58.68-1.1 1.79-.96 2.87 1.05.08 2.12-.51 2.74-1.3z"/></svg>
                Mit Apple registrieren
            </button>
        </div>

        <div class="divider">oder mit Daten</div>
        
        <form id="registerForm">
            <!-- Auswahl E-Mail oder Telefon -->
            <div class="method-selector">
                <button type="button" class="method-btn active" id="emailBtn" onclick="switchMethod('email')">E-Mail</button>
                <button type="button" class="method-btn" id="phoneBtn" onclick="switchMethod('phone')">Telefon</button>
            </div>

            <!-- Dynamisches Eingabefeld (E-Mail oder Telefon) -->
            <div class="form-group" id="inputGroup">
                <label id="inputLabel" for="identifier">E-Mail-Adresse</label>
                <input type="email" id="identifier" name="identifier" placeholder="deine@email.de" required>
            </div>

            <!-- Passwortfeld mit Hinweisen -->
            <div class="form-group">
                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
                <div class="hint">Min. 8 Zeichen, 1 Großbuchstabe, 1 Sonderzeichen.</div>
            </div>

            <button type="submit" class="submit-btn">Konto erstellen</button>

            <div class="login-link">
                Schon einen Account? <a href="#">Anmelden</a>
            </div>
        </form>
    </div>

    <script>
        // Funktion zum Umschalten zwischen E-Mail und Telefon
        function switchMethod(method) {
            const emailBtn = document.getElementById('emailBtn');
            const phoneBtn = document.getElementById('phoneBtn');
            const inputLabel = document.getElementById('inputLabel');
            const identifierInput = document.getElementById('identifier');

            if (method === 'email') {
                emailBtn.classList.add('active');
                phoneBtn.classList.remove('active');
                inputLabel.textContent = 'E-Mail-Adresse';
                identifierInput.type = 'email';
                identifierInput.placeholder = 'deine@email.de';
            } else {
                phoneBtn.classList.add('active');
                emailBtn.classList.remove('active');
                inputLabel.textContent = 'Telefonnummer';
                identifierInput.type = 'tel';
                identifierInput.placeholder = '+49 123 4567890';
            }
        }

        // Platzhalter-Funktion für Social Logins
        function socialRegister(provider) {
            alert('Weiterleitung zur Registrierung mit ' + provider + '...');
            // Hier würdest du später die echte Authentifizierung (z.B. Firebase, Supabase, Google/Apple API) einbinden
        }

        // Passwort-Validierung beim Absenden
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            
            // Regeln: Mindestens 8 Zeichen, 1 Großbuchstabe, 1 Sonderzeichen
            const minLength = password.length >= 8;
            const hasUpperCase = /[A-Z]/.test(password);
            const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

            if (!minLength || !hasUpperCase || !hasSpecialChar) {
                e.preventDefault();
                alert('Das Passwort muss mindestens 8 Zeichen lang sein, einen Großbuchstaben und ein Sonderzeichen enthalten.');
            }
        });
    </script>

</body>
</html>
