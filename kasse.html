<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYSZKA — Sichere Kasse</title>
<style>
:root {
  --bg-color: #FFFFFF;
  --text-color: #1D1D1F;
  --card-bg: #FFFFFF;
  --border-color: #D2D2D7;
  --subtext-color: #86868B;
  --primary: #0071E3;
  --badge-bg: #F5F5F7;
}
[data-theme="dark"] {
  --bg-color: #000000;
  --text-color: #F5F5F7;
  --card-bg: #1C1C1E;
  --border-color: #38383A;
  --subtext-color: #98989D;
  --primary: #0A84FF;
  --badge-bg: #2C2C2E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.4; }

/* HOLY-Stil Checkout Header mit Logo & Einkaufstüte */
.checkout-page-header {
    background-color: #ffde00;
    padding: 20px 0;
    text-align: center;
    border-bottom: 3px solid #000;
}
[data-theme="dark"] .checkout-page-header {
    background-color: #332b00;
    border-bottom: 3px solid #ffde00;
}
.logo-container {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    padding: 8px 24px;
    border-radius: 50px;
    border: 2px solid #000;
    box-shadow: 0 4px 0 #000;
    text-decoration: none;
}
.logo-container svg { width: 28px; height: 28px; color: #000; }
.logo-container h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #000; }

.container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

.cart-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.cart-top-bar h2 { font-size: 24px; font-weight: 800; }
.back-shopping-link { background: none; border: none; font-size: 14px; color: var(--text-color); cursor: pointer; text-decoration: underline; }

/* 2-Spalten Layout */
.checkout-wrapper {
    display: flex;
    gap: 30px;
    background: var(--card-bg);
    border-radius: 12px;
    align-items: flex-start;
}

.checkout-left {
    flex: 1.2;
    background: var(--card-bg);
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 10px 0;
}

.checkout-right {
    flex: 0.9;
    padding: 30px;
    background: #f7f3ec;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: sticky;
    top: 20px;
}
[data-theme="dark"] .checkout-right { background: #151517; }

.section-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; }
.section-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }

.form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
.form-group label { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.form-input, .form-select { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 14px; outline: none; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

.payment-methods-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.payment-method-card { border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; text-align: center; font-size: 13px; font-weight: 600; background: var(--card-bg); cursor: pointer; transition: all 0.2s; }
.payment-method-card.selected { border-color: var(--primary); background: var(--badge-bg); color: var(--primary); }

/* Rechte Spalte (Bestellübersicht) */
.summary-line { display: flex; justify-content: space-between; font-size: 14px; color: var(--subtext-color); }
.summary-line.total { font-size: 18px; font-weight: 800; color: var(--text-color); border-top: 2px solid var(--border-color); padding-top: 15px; margin-top: 10px; }
.checkout-main-action { background: #000; color: #fff; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; text-align: center; transition: background 0.2s; margin-top: 20px; }
[data-theme="dark"] .checkout-main-action { background: #ffde00; color: #000; }
.checkout-main-action:hover { opacity: 0.9; }

@media (max-width: 900px) { 
  .checkout-wrapper { flex-direction: column; } 
  .checkout-right { position: static; width: 100%; }
}
</style>
</head>
<body>

<header class="checkout-page-header">
  <a href="../index.html" class="logo-container">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <path d="M16 10a4 4 0 0 1-8 0"></path>
    </svg>
    <h1>Myszka</h1>
  </a>
</header>

<div class="container">
  <div class="cart-top-bar">
    <h2>Kasse & Zahlungsabwicklung</h2>
    <button class="back-shopping-link" onclick="window.location.href='../index.html'">← Zurück zum Shop</button>
  </div>

  <div class="checkout-wrapper">
    <!-- LINKE SPALTE: Kundendaten & Zahlungsart -->
    <div class="checkout-left">
      <div class="section-card">
        <h3>1. Persönliche Daten & Adresse</h3>
        <div class="form-group">
          <label>Anrede</label>
          <select class="form-select">
            <option>Herr</option>
            <option>Frau</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Vorname *</label><input type="text" class="form-input" placeholder="Max" required></div>
          <div class="form-group"><label>Nachname *</label><input type="text" class="form-input" placeholder="Mustermann" required></div>
        </div>
        <div class="form-group"><label>E-Mail-Adresse (für den Template-Versand) *</label><input type="email" class="form-input" placeholder="max@beispiel.de" required></div>
        <div class="form-row">
          <div class="form-group"><label>Straße & Hausnummer *</label><input type="text" class="form-input" placeholder="Musterstraße 12"></div>
          <div class="form-group"><label>Stadt *</label><input type="text" class="form-input" placeholder="Braunschweig"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>PLZ *</label><input type="text" class="form-input" placeholder="38120"></div>
          <div class="form-group"><label>Land *</label><select class="form-select"><option>Deutschland</option><option>Österreich</option><option>Schweiz</option></select></div>
        </div>
      </div>

      <div class="section-card">
        <h3>2. Zahlungsart wählen</h3>
        <div class="payment-methods-grid">
          <div class="payment-method-card selected" onclick="selectPay(this)">PayPal</div>
          <div class="payment-method-card" onclick="selectPay(this)">Klarna (Sofort/Rechnung)</div>
          <div class="payment-method-card" onclick="selectPay(this)">Kreditkarte</div>
          <div class="payment-method-card" onclick="selectPay(this)">Apple Pay</div>
        </div>
      </div>
    </div>

    <!-- RECHTE SPALTE: Bestellübersicht -->
    <div class="checkout-right">
      <h3 style="font-size: 18px; font-weight: 700;">Bestellübersicht</h3>
      <div id="kasseItemsSummary" style="font-size: 13px; color: var(--subtext-color); display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
        <!-- Dynamischer Inhalt aus dem localStorage -->
      </div>
      <div class="summary-line">
        <span>Zwischensumme</span>
        <span id="kasseSubtotal">0,00 €</span>
      </div>
      <div class="summary-line">
        <span>Versand & digitale Lieferung</span>
        <span style="color: #34C759; font-weight: 600;">Kostenlos</span>
      </div>
      <div class="summary-line total">
        <span>Gesamtbetrag</span>
        <span id="kasseTotal">0,00 €</span>
      </div>
      <button class="checkout-main-action" onclick="alert('Vielen Dank für deine Bestellung! Deine Templates werden versendet.')">Zahlungspflichtig bestellen</button>
      <div style="text-align: center; font-size: 11px; color: var(--subtext-color);">🔒 SSL-verschlüsselte & sichere Transaktion</div>
    </div>
  </div>
</div>

<script>
function selectPay(el) {
  document.querySelectorAll('.payment-method-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

// Hier laden wir die Daten, die der Nutzer im Warenkorb / Shop ausgewählt hat, per localStorage ein
window.addEventListener('DOMContentLoaded', () => {
  const savedCart = JSON.parse(localStorage.getItem('myszka_cart') || '[]');
  const container = document.getElementById('kasseItemsSummary');
  let sum = 0;

  if (savedCart.length === 0) {
    container.innerHTML = '<div>Keine Artikel im Warenkorb gefunden.</div>';
  } else {
    container.innerHTML = savedCart.map(item => {
      sum += item.price * item.qty;
      return `<div style="display: flex; justify-content: space-between;"><span>${item.qty}x ${item.name}</span><span>${(item.price * item.qty).toFixed(2).replace('.', ',')} €</span></div>`;
    }).join('');
  }

  document.getElementById('kasseSubtotal').innerText = sum.toFixed(2).replace('.', ',') + ' €';
  document.getElementById('kasseTotal').innerText = sum.toFixed(2).replace('.', ',') + ' €';
});
</script>

</body>
</html>
